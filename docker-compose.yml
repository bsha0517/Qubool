version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: dosti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dosti
      POSTGRES_PASSWORD: dosti
      POSTGRES_DB: dosti
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dosti -d dosti"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dosti-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dosti-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    env_file:
      - ./backend.env.docker
    environment:
      DATABASE_URL: "postgresql://dosti:dosti@postgres:5432/dosti"
      REDIS_URL: "redis://redis:6379"
      CORS_ORIGIN: "http://localhost:5173"
    command: >
      sh -c "npx prisma migrate deploy && npx prisma generate && node src/server.js"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dosti-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:4000"

volumes:
  postgres_data:
